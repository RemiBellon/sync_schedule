[project]
name = "ics_schedule_sync"
version = "0.1.0"
description = "Updated schedule to personal phone calendar."
authors = [{ name = "Rémi BELLON" }]
requires-python = ">=3.11"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "pandas (>=3.0.5,<4.0.0)",
    "odfpy (>=1.4.1,<2.0.0)",
    "icalendar (>=7.3.0,<8.0.0)",
    "pytz (>=2026.3.post1,<2027.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
