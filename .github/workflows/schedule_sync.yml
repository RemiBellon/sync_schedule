name: Update Schedule ICS

on:
  push:
    branches:
      - main
  schedule:
    # Execute script everyday at 2h00 AM and 2h00 PM
    - cron: '0 2,14 * * *'
  workflow_dispatch: # Force manual execution from GitHub interface

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Authorise to create the branch gh-pages

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Python configuration
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python3 -

      - name: Dependancies installation
        run: poetry install --no-root

      - name: Synchronisation script execution
        env:
          NEXTCLOUD_PASSWORD: ${{ secrets.NEXTCLOUD_PASSWORD }}
        run: poetry run python src/schedule_sync/main.py

      - name: Déploy on GitHub Pages (Branche gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./data  # dossier data/ published
          force_orphan: true   # Keed history of the branch gh-pages clean and light